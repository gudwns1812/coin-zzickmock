plugins {
    id 'org.springframework.boot' version '3.5.13' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'coin'
version = '0.0.1-SNAPSHOT'

ext {
    springBootVersion = '3.5.13'
}

apply from: 'gradle/conventions/backend-common.gradle'
apply from: 'gradle/lint/architecture-lint.gradle'
apply from: 'gradle/tasks/runtime-verification.gradle'
apply from: 'gradle/tasks/storage-resource-verification.gradle'
apply from: 'gradle/tasks/check.gradle'
